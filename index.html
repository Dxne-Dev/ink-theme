<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Dxne-Dev — Développeur Web &amp; Interfaces</title>
    <meta name="description" content="Dxne-Dev conçoit des applications web rapides, des shaders WebGL2 interactifs et des interfaces soignées." />
    <!-- Keep this key in sync with src/ui/theme.ts. Run before paint to avoid a theme flash. -->
    <script>
      (() => {
        let saved = null;
        try { saved = localStorage.getItem('ink-theme:theme:v1'); } catch {}
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved
          : systemDark ? 'dark' : 'light';
      })();
    </script>
    <style>
      html[data-theme='light'] { background: #f6f4ef; }
      html[data-theme='dark'] { background: #0b0b0f; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
